baseURL = 'https://thomasht86.github.io/ad-se-ipsum/'
locale = 'en-us'
title = 'attempts'
theme = 'PaperMod'
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[params]
  defaultTheme = 'dark'   # 'dark' | 'light' | 'auto'; readers can still toggle
  mainSections = ['posts']   # home, archive and RSS list only these; old posts live under /old/
  ShowReadingTime = true
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowToc = true
  TocOpen = false

  [params.homeInfoParams]
    Title = 'attempts'
    Content = 'Writings about AI, philosophy, life, sports and kids.'

[[menu.main]]
  name = 'Archive'
  url = '/archives/'
  weight = 10
[[menu.main]]
  name = 'Tags'
  url = '/tags/'
  weight = 20
[[menu.main]]
  name = 'Search'
  url = '/search/'
  weight = 30
[[menu.main]]
  name = 'Old'
  url = '/old/'
  weight = 35
[[menu.main]]
  name = 'About'
  url = '/about/'
  weight = 40

[outputs]
  home = ['HTML', 'RSS', 'JSON']   # JSON powers the search page

[markup]
  [markup.highlight]
    noClasses = false   # PaperMod ships its own Chroma CSS
  [markup.goldmark.renderer]
    unsafe = true       # allow raw HTML in markdown
